<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>Día a día</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0;background:#0A0A0B;color:#F4EFE3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
  .logo{width:96px;height:96px;margin-bottom:20px}
  h1{font-size:24px;margin:0 0 10px;font-weight:700}
  p{color:#A39E92;font-size:16px;line-height:1.5;max-width:320px;margin:0 0 24px}
  button{height:48px;padding:0 26px;border-radius:14px;border:0;background:#F2C230;color:#0A0A0B;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0A0A0B"/><g transform="translate(50 50) scale(1.0) translate(-49 -56.8)"><g fill="#F2C230"><rect x="19" y="64" width="4.5" height="8" rx="2.25" opacity=".3"/><rect x="27" y="59" width="4.5" height="13" rx="2.25" opacity=".42"/><rect x="35" y="54" width="4.5" height="18" rx="2.25" opacity=".55"/><rect x="43" y="49" width="4.5" height="23" rx="2.25" opacity=".7"/><rect x="51" y="44" width="4.5" height="28" rx="2.25" opacity=".85"/></g><path d="M69 72C65.5 62 60 54 60 45a9 9 0 0 1 18 0c0 9-5.5 17-9 27z" fill="#F2C230"/><circle cx="69" cy="45" r="3.2" fill="#0A0A0B"/><path d="M18 77h62" stroke="#F4EFE3" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></g></svg></div>
  <h1>Sin conexión</h1>
  <p>La primera vez la app necesita internet para descargarse. Después ya funciona sin conexión.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
