name: Gasolineras

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar precios
        run: node scripts/gasolineras.mjs
      - name: Guardar cambios
        run: |
          git config user.name "dia-a-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gasolineras.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios de gasolineras"
            git pull --rebase
            git push
          fi
