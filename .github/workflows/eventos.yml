name: Eventos de Teruel

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar eventos con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/eventos.mjs
      - name: Guardar cambios
        run: |
          git config user.name "dia-a-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Eventos de Teruel actualizados"
            git pull --rebase
            git push
          fi
