<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Día a día</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0A0A0B;--surface:#151517;--sunk:#0F0F11;--ink:#F4EFE3;--muted:#A39E92;--faint:#6F6B63;
  --line:rgba(244,239,227,.08);--line-2:rgba(244,239,227,.17);--on-ink:#0A0A0B;
  --accent:#F2C230;--on-accent:#0A0A0B;
  --evento:#F2C230;--tarea:#E9E2CF;--gasto:#E58A7B;--ingreso:#A9CF8F;--viaje:#D9A21B;--lugar:#F5D97E;--nota:#A8A296;--star:#F2C230;--cuenta:#CDBB8E;--traspaso:var(--cuenta);--teruel:#F2C230;--cumple:#F5D97E;--caducidad:#E0A458;--ocio:#BDB4D6;
  --water:#0C0C0D;--land:#1C1C1F;--coast:#3D3A31;--prov:#28272B;
  --tint:15%;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page);-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
html.locked,html.locked body{overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
main{max-width:560px;margin:0 auto;padding:10px 14px 112px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 16px}
.head.two{display:block;padding-top:2px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hyr{font-size:16px;font-weight:650;color:var(--accent);letter-spacing:.08em}
.hleft{display:flex;align-items:center;gap:10px}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.set-sec h3{margin:0 0 6px;font-size:16px}
.set-sec .note{margin-top:8px}
.set-sec a{color:var(--evento)}
.title{margin:0;min-width:0;max-width:100%;overflow-wrap:anywhere;font-weight:760;font-stretch:75%;font-size:clamp(44px,14.5vw,72px);line-height:.86;letter-spacing:-.025em}
.title{color:var(--ink)}
.title .yr{font-size:17px;font-weight:500;font-stretch:100%;letter-spacing:0;color:var(--muted);margin-left:4px}
.title.t2{font-size:clamp(34px,10vw,50px);line-height:.95;margin-top:4px}
.navs{display:flex;gap:6px;align-items:center;flex:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;font-size:20px;line-height:1}
.pill{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--faint);font-weight:600;padding:0 0 6px}
.wk span{padding-left:9px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:3px;touch-action:pan-y}
.cell{position:relative;height:64px;border:0;background:transparent;border-radius:12px;padding:0;text-align:left}
.cell .n{position:absolute;top:4px;left:4px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--accent);color:var(--on-accent)}
.cell.sel{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.out .n,.cell.out .dots,.cell.out .money{opacity:.35}
.cell .dots{position:absolute;top:33px;left:9px;display:flex;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cell .money{position:absolute;left:8px;bottom:12px;font-size:10.5px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.neg{color:var(--gasto)}.pos{color:var(--ingreso)}
.rib{position:absolute;left:0;right:0;bottom:4px;height:4px;background:var(--viaje)}
.rib.l1{bottom:10px;background:color-mix(in srgb,var(--viaje) 55%,var(--nota))}
.rib.s{left:7px;border-radius:2px 0 0 2px}
.rib.e{right:7px;border-radius:0 2px 2px 0}
.rib.s.e{border-radius:2px}

.panel{margin-top:14px;background:var(--surface);border-radius:22px;padding:18px 14px 14px;border:1px solid var(--line)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;padding:0 2px}
.dayhead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.tag{font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:3px}
.daynet{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.adds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;padding:0 2px;border-radius:13px;border:0;background:color-mix(in srgb,var(--c) var(--tint),transparent);color:color-mix(in srgb,var(--c) 82%,var(--ink));font-weight:650;font-size:13px}
.add svg{flex:none}

.comp{margin-top:12px;border-radius:16px;background:var(--sunk);border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);padding:12px}
.comp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:650;color:color-mix(in srgb,var(--c) 82%,var(--ink))}
.comp-top .on{font-weight:500;color:var(--muted)}
.x{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
.row{display:flex;gap:8px}
.row+.row{margin-top:8px}
.field{height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:16px;min-width:0;width:100%}
textarea.field{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.45}
.field:focus{outline:none;border-color:var(--c,var(--evento));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--evento)) 22%,transparent)}
.f-amt{width:112px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.f-time{width:108px;flex:none}
.lbl{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;font-size:13.5px;color:var(--muted);font-weight:500}
.lbl .field{color:var(--ink);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.chips.sc::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent);font-weight:600}
.err{color:var(--gasto);font-size:14px;margin:8px 2px 0}
.err:empty{display:none}
.acts{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.acts .q{font-size:14px;color:var(--muted);margin-right:auto}
.save{margin-left:auto;height:44px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.save.sm{height:38px;padding:0 16px;margin-left:0}
.ghost{height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-weight:600}
.danger{color:var(--gasto)}
.save.danger{background:var(--gasto);color:var(--surface)}

.list{list-style:none;margin:12px 0 0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--tint),transparent);color:var(--c);overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:2px 0;display:flex;align-items:center;gap:10px}
.tx{flex:1;min-width:0}
.t{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.smini{color:var(--star);font-weight:700;white-space:nowrap;font-size:14px}
.check{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--tarea);background:transparent;display:grid;place-items:center;color:var(--surface);padding:0}
.check[aria-checked="true"]{background:var(--tarea)}
.item.done .t{text-decoration:line-through;color:var(--faint)}
.mini{flex:none;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600}
.grp{font-size:13.5px;font-weight:650;color:var(--muted);margin:16px 2px 0}
.empty{color:var(--muted);font-size:14.5px;margin:14px 2px 4px}
.tripday{width:100%;display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:10px 12px;border-radius:14px;border:0;background:color-mix(in srgb,var(--viaje) var(--tint),transparent);text-align:left}
.tripday svg{color:var(--viaje);flex:none}

.balance{padding:2px 2px 4px}
.label{font-size:14px;color:var(--muted);margin:0}
.big{margin:4px 0 0;font-size:clamp(44px,13vw,60px);font-weight:760;font-stretch:80%;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.note{font-size:14px;color:var(--muted);margin:12px 2px 0}
.card{background:var(--surface);border-radius:22px;padding:18px 16px;border:1px solid var(--line);margin-top:14px}
.card h2{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--muted);margin:0 0 8px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;margin:12px 0 0}
.cat .cn{font-weight:600;font-size:15px}
.cat .cv{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.cat .cv small{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:4px}
.track{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c,var(--gasto))}
.fill.plan{opacity:.33}
.ups{display:flex;flex-direction:column}
.up{display:flex;align-items:center;gap:10px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.up:first-child{border-top:0}
.up .ud{width:62px;flex:none;font-size:13px;font-weight:650;color:var(--muted)}
.up .ic{width:28px;height:28px;border-radius:8px}
.up .ut{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .um{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.trip{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-top:1px solid var(--line);--c:var(--viaje)}
.card .trip:first-of-type{border-top:0}
.tr1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tr1 b{font-size:16px}
.tr1 span,.tr2{font-size:13.5px;color:var(--muted)}
.trip .track{margin:8px 0 6px}
.year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;margin-top:12px}
.ycol{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:6px 0;border-radius:8px}
.ycol.cur{background:var(--sunk)}
.ybars{display:flex;gap:2px;align-items:flex-end;height:92px}
.yb{width:6px;border-radius:3px 3px 1px 1px}
.ylab{font-size:11.5px;color:var(--faint);font-weight:600}
.ycol.cur .ylab{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status{font-size:12.5px;color:var(--faint);text-align:center;margin:20px 0 0}

.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px;--c:var(--viaje)}
.tchips::-webkit-scrollbar{display:none}
.mapbox{position:relative;height:min(56vh,520px);min-height:300px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--water)}
#map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.water{fill:var(--water)}
.land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.provs{fill:none;stroke:var(--prov);stroke-width:1;vector-effect:non-scaling-stroke}
.prov-l{font-size:11px;fill:var(--faint);text-anchor:middle;font-weight:500;pointer-events:none}
.route{fill:none;stroke:var(--viaje);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.route.faint{opacity:.5;stroke-width:2}
.hit{fill:transparent}
.pin{cursor:pointer}
.pin .b{fill:var(--accent);stroke:var(--page);stroke-width:2}
.pin.approx .b{stroke-dasharray:3 2}
.pin.sel .b{stroke:var(--ink);stroke-width:3}
.pin .pn{fill:var(--on-accent);font-size:11.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.plab{font-size:12.5px;font-weight:650;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.tmark{cursor:pointer}
.tmark rect{fill:var(--viaje);stroke:var(--page);stroke-width:2}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl .iconbtn{width:38px;height:38px}
.placing{position:absolute;left:10px;right:10px;bottom:10px;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;font-size:14.5px}
.placing span{flex:1}
.placing button{height:36px;padding:0 12px;border-radius:10px;border:0;background:color-mix(in srgb,var(--on-ink) 18%,transparent);color:var(--on-ink);font-weight:600}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;margin:0;color:var(--muted);font-size:14.5px;pointer-events:none}
.map-msg:empty{display:none}
.pcard{display:flex;gap:12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.thumb{flex:none;width:68px;height:68px;border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--lugar) var(--tint),transparent);display:grid;place-items:center;color:var(--lugar)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.stars{display:inline-flex;gap:1px;font-size:14px;line-height:1;white-space:nowrap;vertical-align:-1px}
.shs{position:relative;display:inline-block;width:1em;height:1em}
.shs .b,.shs .f{position:absolute;left:0;top:0;bottom:0;overflow:hidden}
.shs .b{color:var(--line-2);width:1em}
.shs .f{color:var(--star)}
.shs i{font-style:normal;display:inline-block;width:1em;text-align:center}
.badge{display:inline-block;font-size:12px;font-weight:650;padding:1px 8px;border-radius:10px;background:color-mix(in srgb,var(--ingreso) var(--tint),transparent);color:color-mix(in srgb,var(--ingreso) 80%,var(--ink));white-space:nowrap}
.badge.no{background:color-mix(in srgb,var(--gasto) var(--tint),transparent);color:color-mix(in srgb,var(--gasto) 80%,var(--ink))}
.tip{display:block;font-size:14px;margin-top:4px}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.srow .m{display:inline}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btnrow.sm{margin-top:10px}
.btnrow.sm .sec{height:36px;font-size:13.5px;padding:0 12px}
.sec{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14.5px}
.pri{height:42px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14.5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.k{background:var(--sunk);border-radius:14px;padding:10px 12px}
.k span{display:block;font-size:13px;color:var(--muted)}
.k b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.k small{font-size:12.5px;color:var(--muted);margin-left:4px}
.h3{font-size:16px;font-weight:700;margin:18px 0 2px}
.ai{margin-top:12px;background:var(--sunk);border-radius:16px;padding:12px 14px}
.ait{margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap}
.ai .meta{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.phb{flex:none;width:86px;height:86px;border-radius:12px;overflow:hidden;border:0;padding:0;background:var(--sunk)}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.stop{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.num.off{background:var(--sunk);color:var(--muted)}

.sitio{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:10px;align-items:flex-start}
.catb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;text-align:left;border:0;background:none;padding:0;margin:14px 0 0}
.catb .cn{font-weight:600;font-size:15px}
.catb .cv{font-weight:650;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.catb .cv small{color:var(--star);font-weight:650;font-size:12.5px;margin-left:6px}
.catb .m{grid-column:1/-1}
.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.sortrow .chip{height:30px;font-size:13px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:8px 0;font-size:15px}
.bigstar{font-size:26px;font-weight:760;font-stretch:80%}
.tipbox{margin-top:14px;background:color-mix(in srgb,var(--lugar) 10%,var(--surface));border-radius:16px;padding:12px 14px}
.tipbox b{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.tipbox p{margin:4px 0 0;font-size:16px;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}

a.mini{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}

async function gcall(prompt,o){
  o=o||{};
  if(!SET.geminiKey)throw{code:'no_key'};
  const model=(SET.geminiModel||'gemini-flash-latest').trim();
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(SET.geminiKey)}`;
  const parts=[{text:prompt}];
  if(o.images)for(const im of o.images){parts.push({inline_data:{mime_type:im.type||'image/jpeg',data:await blobToB64(im)}})}
  const body={contents:[{role:'user',parts}]};
  if(o.json)body.generationConfig={responseMimeType:'application/json'};
  let res;
  try{res=await fetch(url,{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'network'}}
  if(!res.ok){let msg='';try{msg=(await res.json()).error.message||''}catch(_){}throw{code:res.status===429?'rate_limited':res.status===404?'bad_model':(res.status===400&&/key/i.test(msg))||res.status===401||res.status===403?'bad_key':'error',message:msg}}
  const j=await res.json();
  const rparts=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[];
  const text=rparts.map(p=>p.text||'').join('').trim();
  if(!text)throw{code:'empty'};
  return text;
}

async function omForecast(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant&hourly=weather_code,temperature_2m,precipitation_probability&timezone=auto&forecast_days=16`;
  const r=await fetch(u);if(!r.ok)throw new Error('om '+r.status);const j=await r.json();
  const d=j.daily,H=j.hourly||{time:[]};
  const byDate={};
  (H.time||[]).forEach((ts,i)=>{const date=ts.slice(0,10),h=+ts.slice(11,13);(byDate[date]||(byDate[date]=[]))[h]={c:H.weather_code[i],t:H.temperature_2m[i],p:H.precipitation_probability[i]}});
  const SEG=[['Madrugada',0,6],['Mañana',6,12],['Tarde',12,18],['Noche',18,24]];

    const code=d.weather_code[i],hs=byDate[date]||[];
    const tramos=SEG.map(([h,a,b])=>{const xs=hs.slice(a,b).filter(Boolean);if(!xs.length)return null;let best=xs[0];xs.forEach(x=>{if(WSEV[wmoSky(x.c)]>WSEV[wmoSky(best.c)])best=x});const mid=hs[a+3]||xs[Math.floor(xs.length/2)];const p=Math.max(...xs.map(x=>x.p||0));return{h,sky:wmoSky(best.c),t:mid&&mid.t!=null?Math.round(mid.t):null,p}}).filter(Boolean);
    const ws=d.wind_speed_10m_max[i],wd=d.wind_direction_10m_dominant[i];
    return{date,sky:wmoSky(code),text:WMO_TXT[code]||'',tmax:Math.round(d.temperature_2m_max[i]),tmin:Math.round(d.temperature_2m_min[i]),rain:d.precipitation_probability_max[i]!=null?Math.round(d.precipitation_probability_max[i]):null,wind:ws!=null?`${wd!=null?WDIRS[Math.round(((wd%360)+360)%360/45)%8]+' ':''}${Math.round(ws)} km/h`:null,tramos};
  });
}

/* ---------- datos ---------- */
function occurrences(from,to){
  const out=[];
  for(const e of S.entries.values()){
    if(!e||!e.date||e.kind==='regalo'||e.kind==='repostaje'||e.kind==='cfg')continue;
    if(e.kind==='viaje'){if(e.date<=to&&(e.end||e.date)>=from)out.push({e,date:e.date});continue}
    const rep=e.repeat||'none';
    if(rep==='none'){if(e.date>=from&&e.date<=to)out.push({e,date:e.date});continue}
    if(rep==='weekly'){
      let d=parse(e.date);
      if(e.date<from)d=addDays(d,Math.floor(daysBetween(e.date,from)/7)*7);
      for(let i=0;i<600;i++){const s=ymd(d);if(s>to||(e.until&&s>e.until))break;if(s>=from)out.push({e,date:s});d=addDays(d,7)}
    }else if(rep==='monthly'||rep==='quarterly'||rep==='yearly'){
      const step=rep==='monthly'?1:rep==='quarterly'?3:12;
      const base=parse(e.date),day=base.getDate();
      let cy=base.getFullYear(),cm=base.getMonth();
      if(step===1&&e.date<from){const f=parse(from);cy=f.getFullYear();cm=f.getMonth()}
      for(let i=0;i<800;i++){
        const dim=new Date(cy,cm+1,0).getDate();const s=ymd(new Date(cy,cm,Math.min(day,dim),12));
        if(s>to||(e.until&&s>e.until))break;
        if(s>=from&&s>=e.date)out.push({e,date:s});
        cm+=step;while(cm>11){cm-=12;cy++}
      }
    }
  }
  const fy=+from.slice(0,4),ty=+to.slice(0,4);
  for(const p of S.entries.values()){
    if(p.kind!=='persona'||!p.cumple)continue;
    for(let yy=fy;yy<=ty;yy++){
      let ds=yy+'-'+p.cumple;if(p.cumple==='02-29'&&!(yy%4===0&&(yy%100!==0||yy%400===0)))ds=yy+'-02-28';
      if(ds>=from&&ds<=to)out.push({e:{id:'cumple-'+p.id,kind:'cumple',title:p.id==='yo'?'Tu cumpleaños':'Cumpleaños de '+p.title,personaId:p.id,anio:p.anio||null,created:0},date:ds});
    }
  }
  return out;
}
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.time||'').localeCompare(String(b.time||''))||(a.created||0)-(b.created||0);
function allTrips(){return [...S.entries.values()].filter(e=>e.kind==='viaje').sort((a,b)=>a.date<b.date?1:-1)}
function allPlaces(){return [...S.entries.values()].filter(e=>e.kind==='lugar').sort(byDate)}
function tripsOn(s){const r=[];for(const e of S.entries.values())if(e.kind==='viaje'&&e.date<=s&&(e.end||e.date)>=s)r.push(e);return r.sort((a,b)=>a.date<b.date?-1:1)}
function tripPlaces(tr){return allPlaces().filter(e=>e.tripId===tr.id)}
function tripSpent(tr){let s=0;S.entries.forEach(x=>{if(x.kind==='gasto'&&x.tripId===tr.id)s+=x.amount||0});return s}
function autoTrip(date){const t=tripsOn(date);return t.length?t[0].id:null}
const gkey=e=>norm(e.title)+'|'+norm(e.city);
function groups(filter){
  const m=new Map();
  for(const e of S.entries.values()){if(e.kind!=='lugar'||(filter&&!filter(e)))continue;const k=gkey(e);let g=m.get(k);if(!g){g={key:k,visits:[]};m.set(k,g)}g.visits.push(e)}
  return [...m.values()].map(g=>{
    g.visits.sort((a,b)=>-byDate(a,b));const v=g.visits;
    g.name=v[0].title;g.city=(v.find(x=>x.city)||{}).city||'';g.ptype=(v.find(x=>x.ptype)||{}).ptype||'';
    const rated=v.filter(x=>x.rating);g.avg=rated.length?rated.reduce((s,x)=>s+x.rating,0)/rated.length:null;
    g.cuisine=(v.find(x=>x.cuisine)||{}).cuisine||'';
    g.tip=(v.find(x=>x.tip)||{}).tip||'';const ag=v.find(x=>x.again===true||x.again===false);g.again=ag?ag.again:null;
    g.photos=v.flatMap(x=>x.photos||[]);g.last=v[0].date;return g;
  });
}

/* ---------- cuentas: datos ---------- */
function accounts(){return [...S.entries.values()].filter(e=>e.kind==='cuenta').sort((a,b)=>((AORDER[a.atype]??9)-(AORDER[b.atype]??9))||(a.created||0)-(b.created||0))}
function defaultAcc(){const a=accounts().filter(x=>x.atype!=='inversion');return a.find(x=>x.primary)||a.find(x=>x.atype!=='deuda')||null}
function accountOf(e,def){
  if(e.account){const a=S.entries.get(e.account);return a&&a.kind==='cuenta'?a.id:null}
  const d=def===undefined?defaultAcc():def;return d?d.id:null;
}
function anchorsOf(a){return (a.anchors||[]).slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.at||0)-(y.at||0))}
function accFlows(acc,from,to,def){
  const out=[];if(def===undefined)def=defaultAcc();
  occurrences(from,to).forEach(({e,date})=>{
    let v=0;
    if(e.kind==='gasto'||e.kind==='ingreso'){if(accountOf(e,def)===acc.id)v=e.kind==='gasto'?-(e.amount||0):(e.amount||0)}
    else if(e.kind==='traspaso'){if(e.from===acc.id)v-=e.amount||0;if(e.to===acc.id)v+=e.amount||0}
    if(v)out.push({date,ts:e.created||0,v,e});
  });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
}
function balAt(acc,D,fl){
  const an=anchorsOf(acc).filter(a=>a.date<=D);if(!an.length)return null;
  const A=an[an.length-1];let b=A.balance;
  (fl||accFlows(acc,A.date,D)).forEach(f=>{if(f.date>D||f.date<A.date||(f.date===A.date&&f.ts<=(A.at||0)))return;b+=f.v});
  return Math.round(b*100)/100;
}
function investedOf(acc,D,fl){
  const an=anchorsOf(acc);if(!an.length)return 0;const A=an[0];
  let inv=acc.invested!=null?acc.invested:A.balance;
  (fl||accFlows(acc,A.date,D)).forEach(f=>{if(f.e.kind!=='traspaso'||f.date>D)return;if(f.date<A.date||(f.date===A.date&&f.ts<=(A.at||0)))return;inv+=f.v});
  return Math.round(inv*100)/100;
}
function worth(){
  const t=todayStr(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),mEnd=ymd(new Date(y,m+1,0,12));
  const def=defaultAcc(),last=mEnd>t?mEnd:t;
  const rows=accounts().map(a=>{const an=anchorsOf(a);if(!an.length)return{a,bal:null,end:null,fl:[],first:null};const fl=accFlows(a,an[0].date,last,def);return{a,fl,first:an[0].date,bal:balAt(a,t,fl),end:balAt(a,mEnd,fl)}});
  let money=0,inv=0,debt=0,end=0,hm=false,hi=false,hd=false;
  rows.forEach(r=>{if(r.bal==null)return;if(r.a.atype==='inversion'){inv+=r.bal;hi=true}else if(r.a.atype==='deuda'){debt+=r.bal;hd=true}else{money+=r.bal;hm=true}end+=r.end==null?r.bal:r.end});
  const firsts=rows.map(r=>r.first).filter(Boolean).sort();
  const hist=[];
  if(firsts.length){
    const f=parse(firsts[0]);let cy=f.getFullYear(),cm=f.getMonth();
    const minIdx=y*12+m-11;if(cy*12+cm<minIdx){cy=Math.floor(minIdx/12);cm=minIdx%12}
    while(cy*12+cm<y*12+m){
      const D=ymd(new Date(cy,cm+1,0,12));let s2=0,any=false;
      rows.forEach(r=>{if(!r.first)return;const b=balAt(r.a,D,r.fl);if(b!=null){s2+=b;any=true}});
      if(any)hist.push({y:cy,m:cm,v:s2});
      cm++;if(cm>11){cm=0;cy++}
    }
    hist.push({y,m,v:money+inv+debt,now:true});
  }
  return {rows,money,inv,debt,total:money+inv+debt,endTotal:end,hasMoney:hm,hasInv:hi,hasDebt:hd,hist,mEnd};
}

const SKY={sol:'Soleado',parcial:'Nubes y claros',nubes:'Nublado',lluvia:'Lluvia',tormenta:'Tormentas',nieve:'Nieve',niebla:'Niebla'};

function weatherFor(s){

function renderCal(){
  const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
  const first=new Date(y,m,1,12),offset=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const total=Math.ceil((offset+dim)/7)*7,start=addDays(first,-offset);
  const from=ymd(start),to=ymd(addDays(start,total-1)),t=todayStr();
  const idx={};const get=s=>idx[s]||(idx[s]={kinds:new Set(),net:0,ribs:[]});
  const occ=occurrences(from,to);
  const trips=occ.filter(o=>o.e.kind==='viaje').map(o=>o.e).sort((a,b)=>a.date<b.date?-1:1);
  const laneEnd=[];
  trips.forEach(e=>{
    const end=e.end||e.date;let lane=laneEnd.findIndex(x=>x<e.date);if(lane<0)lane=laneEnd.length;laneEnd[lane]=end;
    if(lane>1)return;
    let d=parse(e.date<from?from:e.date);const stop=end>to?to:end;
    for(let i=0;i<400;i++){const s=ymd(d);if(s>stop)break;get(s).ribs.push({lane,s:s===e.date,e:s===end});d=addDays(d,1)}
  });

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
async function compress(file){

  const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  const s=Math.min(1,1600/Math.max(w0,h0)),w=Math.round(w0*s),h=Math.round(h0*s);

}

/* ---------- ubicar en el mapa ---------- */
const GQ=[];let gBusy=false;const gTries={};
function geoPrompt(e){
  const tr=e.tripId&&S.entries.get(e.tripId);
  const zona=e.kind==='viaje'?'':(e.city||(tr&&tr.title)||'');
  return `Necesito las coordenadas de un sitio para ponerlo en un mapa.
Sitio: ${JSON.stringify(e.title)}
${zona?`Ciudad o zona: ${JSON.stringify(zona)}\n`:''}${e.kind==='viaje'?'Es el destino de un viaje: una ciudad, región o país.\n':''}Si el nombre es ambiguo, da prioridad a España salvo que la zona indique otro país.
Si conoces el sitio concreto, da sus coordenadas con "precision": "sitio". Si no lo conoces, da las del centro de la ciudad o zona con "precision": "ciudad". Si no hay forma de saberlo, devuelve lat y lon como null.
Responde solo con JSON, por ejemplo: {"lat": 39.4699, "lon": -0.3763, "precision": "ciudad"}`;
}
function queueGeo(id){if(!GQ.includes(id))GQ.push(id);runGeo()}
async function runGeo(){
  if(gBusy)return;gBusy=true;
  while(GQ.length){
    const id=GQ.shift();const e=S.entries.get(id);if(!e||hasGeo(e))continue;
    gTries[id]=(gTries[id]||0)+1;
    try{
      let r;
      if(S.sample){r=await S.sample.json(geoPrompt(e))}
      else{const tr=e.tripId&&S.entries.get(e.tripId);const g=await omGeocode(e.kind==='viaje'?e.title:(e.city||(tr&&tr.title)||e.title));r=g?{lat:g.lat,lon:g.lon,precision:'ciudad'}:{lat:null,lon:null}}
      const cur=S.entries.get(id);if(!cur||hasGeo(cur))continue;
      const lat=r&&Number(r.lat),lon=r&&Number(r.lon);
      if(r&&r.lat!=null&&r.lon!=null&&isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180){
        persist(Object.assign({},cur,{lat,lon,geo:'auto',geoPrec:r.precision==='sitio'?'sitio':'ciudad'}));
        if(cur.kind==='viaje'&&cur.transport==='coche')computeTripKm(id);
      }else{persist(Object.assign({},cur,{geoFail:true}));toast('No se ha encontrado «'+cur.title+'». Márcalo en el mapa.')}
    }catch(err){
      const c=err&&err.code;
      if(c==='bad_key'||c==='bad_model'||c==='no_key'){toast(gemErr(err));GQ.length=0;break}
      if(c==='network'){GQ.length=0;break}
      if(c==='rate_limited'&&gTries[id]<3){await sleep(4000);GQ.unshift(id);continue}
    }
  }
  gBusy=false;
}

/* ---------- km en coche ---------- */
async function routeKm(a,b){
  const u=`https://router.project-osrm.org/route/v1/driving/${a.lon.toFixed(5)},${a.lat.toFixed(5)};${b.lon.toFixed(5)},${b.lat.toFixed(5)}?overview=false`;
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(u,{signal:ctl.signal});if(!r.ok)return null;const j=await r.json();const d=j&&j.routes&&j.routes[0]&&j.routes[0].distance;return d?d/1000:null}finally{clearTimeout(tm)}
}
async function geocodeName(name){
  if(!name)return null;
  if(norm(name)===norm(HOME.name))return{lat:HOME.lat,lon:HOME.lon};
  const og=await omGeocode(name).catch(()=>null);if(og)return og;
  if(!S.sample)return null;
  try{const r=await S.sample.json(`Necesito las coordenadas del centro de este lugar para un mapa: ${JSON.stringify(name)}. Si es ambiguo, da prioridad a España. Responde solo con JSON, por ejemplo: {"lat": 40.34, "lon": -1.11}. Si no lo sabes, usa null.`);const lat=Number(r&&r.lat),lon=Number(r&&r.lon);return r&&r.lat!=null&&isFinite(lat)&&isFinite(lon)?{lat,lon}:null}catch(_){return null}
}
const kmBusy={};
async function computeTripKm(id){
  const tr=S.entries.get(id);
  if(!tr||tr.kind!=='viaje'||tr.transport!=='coche'||kmBusy[id])return;
  if(tr.km&&tr.km.method==='manual')return;
  if(!hasGeo(tr))return;
  kmBusy[id]=true;
  try{
    const fromName=tr.fromName||HOME.name;
    let from=tr.fromLat!=null?{lat:tr.fromLat,lon:tr.fromLon}:await geocodeName(fromName);
    if(!from)return;
    let ida=null,method='aprox';
    try{const r=await routeKm(from,{lat:tr.lat,lon:tr.lon});if(r>0){ida=Math.round(r);method='ruta'}}catch(_){}
    if(!ida)ida=Math.round(haversine(from,{lat:tr.lat,lon:tr.lon})*1.25);
    const cur=S.entries.get(id);if(!cur||cur.transport!=='coche'||(cur.km&&cur.km.method==='manual'))return;
    persist(Object.assign({},cur,{fromLat:from.lat,fromLon:from.lon,km:{ida,total:ida*2,method,at:Date.now(),from:fromName}}));
  }finally{delete kmBusy[id]}
}
function tripKmText(tr){
  if(tr.transport!=='coche')return tr.transport&&TRANSPORT_TXT[tr.transport]?cap(TRANSPORT_TXT[tr.transport]):'';
  if(tr.km&&tr.km.total)return `En coche, ${fmtKm(tr.km.total)}`;
  return hasGeo(tr)?'En coche, calculando km…':'En coche. Falta ubicar el destino para calcular los km';
}

/* ---------- mapa ---------- */

function fitBase(){
  const r=$('#map-box').getBoundingClientRect();

  M.proj=d3.geoMercator().fitSize([M.W,M.H],M.fc);
  M.path=d3.geoPath(M.proj);if(typeof M.path.digits==='function')M.path.digits(5);
  $('#map-land').setAttribute('d',M.path(M.fc)||'');

  M.provC=M.provF.map(f=>({n:(f.properties&&f.properties.name||'').split('/')[0],c:M.path.centroid(f)}));

function focusPts(pts,animate,close){
  if(!M.ready)return;
  if(!pts.length)pts=[[-9.3,36.1],[3.4,43.8]];
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const min=close?0.02:0.08;
  if(x1-x0<min){const c=(x0+x1)/2;x0=c-min/2;x1=c+min/2}
  if(y1-y0<min*0.7){const c=(y0+y1)/2;y0=c-min*0.35;y1=c+min*0.35}
  const a=M.proj([x0,y1]),b=M.proj([x1,y0]);
  const pad=44;
  let k=Math.min((M.W-pad*2)/Math.max(1e-6,b[0]-a[0]),(M.H-pad*2)/Math.max(1e-6,b[1]-a[1]));
  k=Math.max(0.8,Math.min(40000,k));
  const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
  const t=d3.zoomIdentity.translate(M.W/2-k*cx,M.H/2-k*cy).scale(k);
  if(animate&&!reduceMotion())M.svg.transition().duration(650).call(M.zoom.transform,t);else M.svg.call(M.zoom.transform,t);
}
function currentPts(){
  const pts=[];
  if(S.mapTrip==='pend')listOf('pendiente').filter(hasGeo).forEach(e=>pts.push([e.lon,e.lat]));
  else if(S.mapTrip!=='all'){const tr=S.entries.get(S.mapTrip);if(tr){tripPlaces(tr).filter(hasGeo).forEach(e=>pts.push([e.lon,e.lat]));if(!pts.length&&hasGeo(tr))pts.push([tr.lon,tr.lat])}}
  else{allPlaces().filter(hasGeo).forEach(e=>pts.push([e.lon,e.lat]));allTrips().filter(hasGeo).forEach(e=>pts.push([e.lon,e.lat]))}
  return pts;
}
function focusCurrent(animate){focusPts(currentPts(),animate,false)}
function drawOverlay(){
  if(!M.ready)return;
  const t=M.t,P=(lon,lat)=>t.apply(M.proj([lon,lat]));
  const tl=M.proj.invert(t.invert([0,0])),br=M.proj.invert(t.invert([M.W,M.H]));
  const span=Math.abs(br[0]-tl[0]);

function startMusic(total){
  const ac=S.actx;if(!ac||ac.state!=='running'||!ac.createMediaStreamDestination)return null;
  try{
    const dest=ac.createMediaStreamDestination(),master=ac.createGain();master.connect(dest);
    const now=ac.currentTime+0.05,oscs=[];
    master.gain.setValueAtTime(0.0001,now);master.gain.exponentialRampToValueAtTime(0.22,now+1.2);
    master.gain.setValueAtTime(0.22,now+Math.max(1.3,total-2));master.gain.exponentialRampToValueAtTime(0.0001,now+total);
    const hz=n=>440*Math.pow(2,(n-69)/12);
    const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],dur=3.2;
    const note=(n,t,d,peak,type)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(n);g.gain.setValueAtTime(0.0001,now+t);g.gain.exponentialRampToValueAtTime(peak,now+t+Math.min(0.4,d/3));g.gain.exponentialRampToValueAtTime(0.0001,now+t+d);o.connect(g);g.connect(master);o.start(now+t);o.stop(now+t+d+0.05);oscs.push(o)};
    for(let t=0,i=0;t<total;t+=dur,i++){
      const ch=chords[i%4];
      note(ch[0]-12,t,dur+0.3,0.22,'triangle');
      ch.forEach(n=>note(n,t,dur+0.3,0.09,'sine'));
      for(let a=0;a<8;a++){const tt=t+a*0.4;if(tt>=total)break;note(ch[a%3]+12,tt,0.38,0.06,'sine')}
    }
    return {track:dest.stream.getAudioTracks()[0],stop(){oscs.forEach(o=>{try{o.stop()}catch(_){}});try{master.disconnect()}catch(_){}}};
  }catch(_){return null}
}
function fitLines(ctx,text,maxW,size,minSize,maxLines,weight){
  for(let fs=size;fs>=minSize;fs-=2){
    ctx.font=`${weight} ${fs}px "Bricolage Grotesque", system-ui, sans-serif`;
    const words=String(text).split(/\s+/);const lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width<=maxW||!cur)cur=t;else{lines.push(cur);cur=w}}
    if(cur)lines.push(cur);
    if(lines.length<=maxLines&&lines.every(l=>ctx.measureText(l).width<=maxW))return{lines,fs};
    if(fs-2<minSize){ctx.font=`${weight} ${minSize}px "Bricolage Grotesque", system-ui, sans-serif`;const keep=lines.slice(0,maxLines);if(lines.length>maxLines)keep[maxLines-1]=keep[maxLines-1].replace(/\s*\S*$/,'')+'…';return{lines:keep,fs:minSize}}
  }
  return{lines:[String(text)],fs:minSize};
}

    const W=720,H=1280,cv=document.createElement('canvas');cv.width=W;cv.height=H;V.canvas=cv;mountPreview();
    const ctx=cv.getContext('2d');
    const places=tripPlaces(tr),located=places.filter(hasGeo);
    const geo=located.length>=2?geoData():null;
    const FADE=0.7,segs=[];let T=0;
    const add=(type,d,extra)=>{segs.push(Object.assign({type,t0:T,d},extra||{}));T+=d};
    add('intro',3);
    loaded.forEach((p,i)=>add('photo',3.2,{p,i}));
    if(geo)add('route',3.6);
    add('outro',3.4);
    const total=T;
    const days=daysBetween(tr.date,tr.end||tr.date)+1;
    const cover=(img,scale,dx,dy)=>{const r=Math.max(W/img.width,H/img.height)*scale,w=img.width*r,h=img.height*r;ctx.drawImage(img,(W-w)/2+dx,(H-h)/2+dy,w,h)};
    const shade=(y0,a)=>{const g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,y0,W,H-y0)};
    const txt=(t,x,y,fs,weight,color,align)=>{ctx.font=`${weight} ${fs}px "Bricolage Grotesque", system-ui, sans-serif`;ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(t,x,y)};
    let proj=null,path=null,routePts=[];
    if(geo){
      const pts=located.map(e=>[e.lon,e.lat]);
      const mp={type:'MultiPoint',coordinates:pts};
      proj=d3.geoMercator().fitExtent([[90,300],[W-90,H-260]],mp);
      const ext=proj.scale();if(!isFinite(ext)||ext>4e6){proj=d3.geoMercator().center(pts[0]).scale(2e5).translate([W/2,H/2])}
      path=d3.geoPath(proj,ctx);routePts=pts.map(p=>proj(p));
    }
    const paint=(seg,lt,alpha,bare)=>{
      ctx.save();ctx.globalAlpha=alpha;
      if(seg.type==='intro'){
        ctx.fillStyle='#0A0A0B';ctx.fillRect(0,0,W,H);
        cover(loaded[0].img,1.12+0.06*lt/seg.d,0,0);ctx.fillStyle='rgba(10,10,11,.58)';ctx.fillRect(0,0,W,H);
        if(!bare){
        const k=ease(lt/0.9);ctx.globalAlpha=alpha*k;
        txt('VIAJE',64,560-30*(1-k),30,700,'#F2C230');
        const f=fitLines(ctx,tr.title,W-128,128,64,3,760);
        f.lines.forEach((l,i)=>txt(l,64,560+f.fs*0.95*(i+1)-30*(1-k),f.fs,760,'#FFFFFF'));
        const yb=560+f.fs*0.95*f.lines.length+70;
        txt(rangeStr(tr.date,tr.end||tr.date)+' '+(tr.date.slice(0,4)),64,yb,36,600,'rgba(255,255,255,.88)');
        txt(`${days} ${days===1?'día':'días'}, ${places.length} ${places.length===1?'sitio':'sitios'}`,64,yb+52,32,500,'rgba(255,255,255,.7)');
        }
      }else if(seg.type==='photo'){
        const p=seg.p,e=p.e,dir=seg.i%2?1:-1;
        ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
        cover(p.img,1.06+0.1*(lt/seg.d),dir*24*(lt/seg.d),-12*(lt/seg.d));
        shade(H*0.5,0.82);
        if(!bare){
        const k=ease((lt-0.25)/0.7);ctx.globalAlpha=alpha*k;const dy=26*(1-k);
        let y=H-120;
        const meta=[e.ptype,e.city,shortDate(e.date)].filter(Boolean).join(', ');
        const tipF=e.tip?fitLines(ctx,'«'+e.tip+'»',W-128,32,26,2,500):null;
        if(tipF){for(let i=tipF.lines.length-1;i>=0;i--){txt(tipF.lines[i],64,y+dy,tipF.fs,500,'rgba(255,255,255,.9)');y-=tipF.fs*1.25}y-=14}
        if(meta){txt(meta,64,y+dy,30,600,'rgba(255,255,255,.78)');y-=50}
        const f=fitLines(ctx,e.title,W-128,72,44,2,760);
        for(let i=f.lines.length-1;i>=0;i--){txt(f.lines[i],64,y+dy,f.fs,760,'#FFFFFF');y-=f.fs*0.98}
        ctx.globalAlpha=alpha;txt(`${seg.i+1}/${loaded.length}`,W-56,96,26,700,'rgba(255,255,255,.75)','right');txt(tr.title,56,96,26,700,'rgba(255,255,255,.75)');
        }
      }else if(seg.type==='route'){
        ctx.fillStyle='#0A0A0B';ctx.fillRect(0,0,W,H);
        ctx.beginPath();path(geo.fc);ctx.fillStyle='#1C1C1F';ctx.fill();ctx.strokeStyle='#3D3A31';ctx.lineWidth=1.5;ctx.stroke();
        ctx.beginPath();path(geo.prov);ctx.strokeStyle='#28272B';ctx.lineWidth=1;ctx.stroke();
        if(!bare){
        const k=ease(lt/(seg.d*0.75)),n=routePts.length,upto=k*(n-1);
        ctx.beginPath();ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#F2C230';
        ctx.moveTo(routePts[0][0],routePts[0][1]);
        for(let i=1;i<n;i++){if(i<=upto)ctx.lineTo(routePts[i][0],routePts[i][1]);else{const f=upto-(i-1);if(f>0)ctx.lineTo(routePts[i-1][0]+(routePts[i][0]-routePts[i-1][0])*f,routePts[i-1][1]+(routePts[i][1]-routePts[i-1][1])*f);break}}
        ctx.stroke();
        routePts.forEach((q,i)=>{if(i>upto+0.001)return;ctx.beginPath();ctx.arc(q[0],q[1],22,0,Math.PI*2);ctx.fillStyle='#F2C230';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#0A0A0B';ctx.stroke();ctx.font='700 22px "Bricolage Grotesque", system-ui, sans-serif';ctx.fillStyle='#0A0A0B';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),q[0],q[1]+1)});
        txt('La ruta',64,170,72,760,'#FFFFFF');
        txt(`${n} paradas`,64,226,32,600,'rgba(255,255,255,.7)');
        }
      }else{
        ctx.fillStyle='#0A0A0B';ctx.fillRect(0,0,W,H);
        cover(loaded[loaded.length-1].img,1.15,0,0);ctx.fillStyle='rgba(10,10,11,.72)';ctx.fillRect(0,0,W,H);
        if(!bare){
        const rows=[['Días',String(days)],['Sitios',String(places.length)],['Fotos',String(all.length)]];
        txt(tr.title,64,330,52,760,'#FFFFFF');
        rows.forEach((r,i)=>{const k=ease((lt-0.2-i*0.18)/0.6);ctx.globalAlpha=alpha*k;const y=480+i*170+20*(1-k);txt(r[0],64,y,32,600,'rgba(255,255,255,.7)');txt(r[1],64,y+78,76,760,'#FFFFFF')});
        ctx.globalAlpha=alpha;txt('Día a día',W/2,H-90,28,700,'rgba(255,255,255,.55)','center');
        }
      }
      ctx.restore();
    };
    const frame=t=>{let i=segs.findIndex(s=>t>=s.t0&&t<s.t0+s.d);if(i<0)i=segs.length-1;const seg=segs[i],lt=t-seg.t0;if(i>0&&lt<FADE){paint(segs[i-1],segs[i-1].d,1,true);paint(seg,lt,lt/FADE)}else paint(seg,lt,1)};
    frame(0);
    const stream=cv.captureStream(30);
    music=startMusic(total);
    if(music&&music.track)stream.addTrack(music.track);
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1600000,audioBitsPerSecond:96000});
    const chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
    const stopped=new Promise(r=>{rec.onstop=r});
    job.stage='rec';rec.start(1000);
    const t0=performance.now();
    await new Promise(resolve=>{
      const tick=()=>{
        if(job.cancel){resolve();return}
        const el=(performance.now()-t0)/1000;
        if(el>=total){frame(total-0.001);resolve();return}
        frame(el);job.pct=Math.min(99,Math.round(el/total*100));updateProgress();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    rec.stop();if(music)music.stop();await stopped;
    stream.getTracks().forEach(t=>{try{t.stop()}catch(_){}});
    if(job.cancel){toast(job.cancel==='hidden'?'El vídeo se ha parado porque saliste de la app. Vuelve a crearlo cuando quieras.':'Vídeo cancelado');return}
    const type=mime.split(';')[0];
    const vb=new Blob(chunks,{type});
    if(!vb.size)throw new Error('vacío');
    job.stage='save';updateProgress(true);
    const r=await S.assets.upload(vb,{type});
    V.blobs[tripId]=vb;
    const cur=S.entries.get(tripId);
    if(!cur){S.assets.delete(r.id).catch(()=>{});return}
    const old=cur.video&&cur.video.id;
    persist(Object.assign({},cur,{video:{id:r.id,sig,at:Date.now(),type,dur:Math.round(total)}}));
    if(old&&old!==r.id)S.assets.delete(old).catch(()=>{});
    toast('El vídeo de '+cur.title+' está listo');
  }catch(err){
    try{if(rec&&rec.state!=='inactive')rec.stop()}catch(_){}
    if(music)music.stop();
    const c=err&&err.code;
    toast(c==='too_large'?'El vídeo ha salido demasiado grande para guardarlo.':c==='quota_or_state'?'No queda espacio para guardar el vídeo.':'No se ha podido crear el vídeo.');
  }finally{
    const again=job.again;V.job=null;V.canvas=null;updateProgress(true);
    if(S.view==='map')renderMapPanel();
    if(again)scheduleVideo(tripId);
  }
}
async function saveVideo(id){

  try{const b=V.blobs[id]||await Media.get(tr.video.id);if(!b)throw 0;const ext=(tr.video.type||b.type||'').indexOf('mp4')>=0?'mp4':'webm';await saveFile(b,`Viaje a ${tr.title}.${ext}`)}
  catch(_){toast('No se ha podido guardar el vídeo.')}
}

/* ---------- resumen del viaje con Gemini ---------- */
function tripData(tr){
  const pl=tripPlaces(tr);
  const gastos=[...S.entries.values()].filter(e=>e.kind==='gasto'&&e.tripId===tr.id);
  const porCat={};gastos.forEach(g=>{const k=g.cat||'Otros';porCat[k]=Math.round(((porCat[k]||0)+(g.amount||0))*100)/100});
  const otros=occurrences(tr.date,tr.end||tr.date).filter(o=>o.e.kind==='evento'||o.e.kind==='nota').slice(0,30).map(o=>({tipo:o.e.kind,fecha:o.date,texto:o.e.title}));
  return {destino:tr.title,desde:tr.date,hasta:tr.end||tr.date,dias:daysBetween(tr.date,tr.end||tr.date)+1,presupuesto:tr.budget||null,transporte:tr.transport||null,km_coche_ida_y_vuelta:tr.transport==='coche'&&tr.km?tr.km.total:null,
    sitios:pl.map(e=>({nombre:e.title,tipo:e.ptype||null,comida:e.cuisine||null,ciudad:e.city||null,fecha:e.date,valoracion:e.rating||null,volveria:e.again===true?'sí':e.again===false?'no':null,recomendacion:e.tip||null,resena:e.review?e.review.slice(0,700):null,fotos:(e.photos||[]).length})),
    gastos:{total:Math.round(gastos.reduce((s,g)=>s+(g.amount||0),0)*100)/100,por_categoria:porCat,detalle:gastos.slice(0,60).map(g=>({concepto:g.title,importe:g.amount,fecha:g.date}))},
    eventos_y_notas:otros};
}
function aiErr(e){return gemErr(e)}
async function summarizeTrip(id){
  const tr=S.entries.get(id);if(!tr||!S.sample)return;
  if(S.ai[id]&&S.ai[id].busy)return;
  const ctl=new AbortController();const st=S.ai[id]={busy:true,text:'',err:'',ctl};
  renderMapPanel();
  const prompt=`Eres el asistente de una app personal de organización. Escribe en español, hablándole de tú a la persona, un resumen de su viaje de entre 120 y 180 palabras. Cuenta cómo fue según sus apuntes, qué sitios valoró mejor y cuáles recomendaría repetir, qué no le gustó si lo hay, y cuánto gastó en total (y frente al presupuesto si lo hay). Usa solo los datos de abajo y no inventes nada. Texto corrido en uno o dos párrafos, sin títulos, sin listas y sin emojis.

DATOS DEL VIAJE (JSON):
${JSON.stringify(tripData(tr))}`;
  try{
    const r=await S.sample(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{st.text=text;const el=document.getElementById('ai-text');if(el)el.textContent=text}});
    delete S.ai[id];
    const cur=S.entries.get(id);
    if(cur&&r&&r.text&&r.text.trim()){persist(Object.assign({},cur,{summary:{text:r.text.trim(),at:Date.now()}}));toast('Resumen guardado')}
    else renderMapPanel();
  }catch(e){
    if(e&&e.code==='cancelled'){delete S.ai[id];renderMapPanel();return}
    st.busy=false;st.err=aiErr(e);st.text=e&&e.text||'';renderMapPanel();
  }
}

function renderSitiosList(){
  const box=$('#sitios-list');if(!box)return;
  const f=S.sit,q=norm(f.q);
  let list=groups().filter(g=>(f.type==='Todos'||g.ptype===f.type)&&(!f.city||norm(g.city)===norm(f.city))&&(!f.cuisine||g.cuisine===f.cuisine)&&(!q||g.visits.some(v=>norm([v.title,v.city,v.tip,v.review,v.ptype,v.cuisine].join(' ')).includes(q))));

function sumRows(rows,key){
  const top=rows[0]?rows[0].visits:1;
  return rows.map(r=>`<button class="catb" ${key}="${esc(r.k)}"><span class="cn">${esc(r.k)}</span><span class="cv">${r.n} ${r.n===1?'sitio':'sitios'}${r.avg?`<small>★ ${fmtRating(r.avg)}</small>`:''}</span><span class="track" style="--c:var(--lugar)"><i class="fill" style="width:${(r.visits/top*100).toFixed(1)}%"></i></span><span class="m">${r.visits} ${r.visits===1?'visita':'visitas'}</span></button>`).join('');
}
function aggregate(gs,keyFn){
  const m={};gs.forEach(g=>{const k=keyFn(g);if(!k)return;const a=m[k]||(m[k]={k,n:0,visits:0,rs:0,rc:0});a.n++;a.visits+=g.visits.length;g.visits.forEach(v=>{if(v.rating){a.rs+=v.rating;a.rc++}})});
  return Object.values(m).map(a=>Object.assign(a,{avg:a.rc?a.rs/a.rc:null})).sort((a,b)=>b.visits-a.visits||b.n-a.n||(b.avg||0)-(a.avg||0));
}

function nwChart(h){
  const n=h.length,W=300,H=100;let mn=Math.min(...h.map(p=>p.v)),mx=Math.max(...h.map(p=>p.v));
  if(mx-mn<1){mx+=1;mn-=1}const pv=(mx-mn)*0.12;mn-=pv;mx+=pv;
  const X=i=>((i+0.5)*W/n).toFixed(2),Y=v=>((mx-v)/(mx-mn)*H).toFixed(2);
  const line=h.map((p,i)=>(i?'L':'M')+X(i)+','+Y(p.v)).join('');
  return `<svg class="nw" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="nwa" d="${line}L${X(n-1)},${H}L${X(0)},${H}Z"/><path class="nwl" d="${line}"/></svg><div class="nwx" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${h.map(p=>`<span>${p.now?'Hoy':cap(monthName(p.m)).slice(0,3)}</span>`).join('')}</div>`;
}
function accRight(r){

  return `<span class="amt ${r.bal<-0.004?'neg':''}">${fmt(r.bal)}</span>`;
}

const SHEETS={cuenta:()=>accSave(),ajustes:()=>settingsSave()};
function accSave(){
  const sh=S.sheet;if(!sh)return;
  const err=m=>{$('#s-err').textContent=m};
  const name=$('#a-name').value.trim();if(!name)return err('Escribe un nombre para la cuenta.');
  const raw=$('#a-val').value.trim();
  if(!raw&&sh.isNew)return err('Pon el saldo de hoy. Si está a cero, pon 0.');
  const v=raw?parseAmount(raw):NaN;
  if(raw&&!isFinite(v))return err('Tiene que ser una cantidad, como 1.250 o 80,50.');
  const bal=sh.atype==='deuda'?-Math.abs(v):v;
  const old=S.entries.get(sh.id),now=Date.now(),t=todayStr();
  const a=Object.assign({},old||{},{id:sh.id,kind:'cuenta',title:name,atype:sh.atype,created:old&&old.created||now});
  let anchors=old&&old.anchors?old.anchors.slice():[];
  if(!old)anchors=[{date:t,at:now,balance:bal}];
  else if(raw){const cur=balAt(old,t);if(cur==null||Math.abs(bal-cur)>0.004)anchors.push({date:t,at:now,balance:bal})}
  a.anchors=anchors.slice(-120);
  if(sh.atype==='inversion'){
    const ri=$('#a-inv').value.trim();
    if(ri){const iv=parseAmount(ri);if(!isFinite(iv))return err('Lo aportado tiene que ser una cantidad, como 4.500.');a.invested=iv}
    else if(!old||old.invested==null)a.invested=anchorsOf(a)[0].balance;
    a.primary=false;
  }else{
    delete a.invested;a.primary=!!sh.primary;
    if(a.primary)accounts().forEach(x=>{if(x.id!==a.id&&x.primary)persist(Object.assign({},x,{primary:false}),true)});
  }
  closeSheet(true);persist(a);
  toast(old?'Cuenta guardada':'Cuenta añadida');
}

function renderSum(){
  if(S.sumP&&S.sumP!=='mes')return renderSumRange();
  renderTitles();
  const y=S.cursor.getFullYear(),m=S.cursor.getMonth(),t=todayStr();
  const from=ymd(new Date(y,m,1,12)),to=ymd(new Date(y,m+1,0,12)),mn=monthName(m);
  const past=to<t,future=from>t;
  let inR=0,inP=0,outR=0,outP=0;const cats={},planned=[];
  for(const {e,date} of occurrences(from,to)){
    if(e.kind!=='gasto'&&e.kind!=='ingreso')continue;
    const real=date<=t,a=e.amount||0;
    if(e.kind==='gasto'){if(real)outR+=a;else outP+=a;const ck=e.cat||'Otros';const cc=cats[ck]||(cats[ck]={r:0,p:0});if(real)cc.r+=a;else cc.p+=a}
    else{if(real)inR+=a;else inP+=a}
    if(!real)planned.push({e,date});
  }
  const pm=new Date(y,m-1,1,12);let prevOut=0;
  occurrences(ymd(pm),ymd(new Date(y,m,0,12))).forEach(({e})=>{if(e.kind==='gasto')prevOut+=e.amount||0});
  let h=sumSegHTML();
  const bigVal=future?inP-outP:inR-outR;
  const bigLabel=future?`Previsto para ${mn}`:past?`Balance de ${mn}`:`Llevas en ${mn}`;
  h+=`<section class="balance"><p class="label">${bigLabel}</p><p class="big ${bigVal<-0.004?'neg':''}">${signed(bigVal)}</p>`;
  h+=`<div class="pair"><div class="stat"><span class="label">${future?'Ingresos previstos':'Ingresado'}</span><b class="pos">${fmt(future?inP:inR)}</b></div><div class="stat"><span class="label">${future?'Gastos previstos':'Gastado'}</span><b class="neg">${fmt(future?outP:outR)}</b></div></div>`;

      .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.e.time||'99').localeCompare(String(b.e.time||'99')));

  }else h+=`<p class="sub">Cuando apuntes gastos en el calendario, aquí verás cuánto va a gasolina, cenas, ocio y lo demás.</p>`;

function dataURLtoBlob(du){const m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(du||'');if(!m)return null;const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]||''})}
async function readBackup(file){
  try{
    let data,media={};
    if(/\.zip$/i.test(file.name)||/zip/.test(file.type)){
      const z=await JSZip.loadAsync(file);const dj=z.file('datos.json');if(!dj)throw 0;data=JSON.parse(await dj.async('string'));
      for(const name of Object.keys(z.files)){const f=z.files[name];if(f.dir||!name.startsWith('media/'))continue;const base=name.slice(6),dot=base.lastIndexOf('.');const id=dot>0?base.slice(0,dot):base;const raw=await f.async('blob');media[id]=new Blob([raw],{type:typeOf(dot>0?base.slice(dot+1).toLowerCase():'')})}
    }else{
      data=JSON.parse(await file.text());
      if(data&&data.photos)Object.entries(data.photos).forEach(([id,du])=>{const b=dataURLtoBlob(du);if(b)media[id]=b});
    }
    if(!data||data.app!=='dia-a-dia'||!Array.isArray(data.entries))throw 0;
    pendingImport={data,media};
    const when=data.exportedAt?shortDate(ymd(new Date(data.exportedAt))):'';

async function applyImport(){

    await dbtx('entries','readwrite',s=>{s.clear();ents.forEach(e=>s.put(e))});
    await dbtx('media','readwrite',s=>{s.clear();Object.entries(p.media).forEach(([id,b])=>s.put(b,id))});
    S.entries=new Map(ents.map(e=>[e.id,e]));await loadMediaURLs();

}

const PERIOD_M={weekly:52/12,monthly:1,quarterly:1/3,yearly:1/12};
const PERIOD_TXT={weekly:'cada semana',monthly:'cada mes',quarterly:'cada 3 meses',yearly:'cada año'};
function recibosList(){
  const t=todayStr(),lim=ymd(addDays(parse(t),400));
  return listOf('gasto').filter(e=>e.repeat&&e.repeat!=='none'&&(!e.until||e.until>=t)).map(e=>{
    const next=occurrences(t,lim).find(o=>o.e.id===e.id);
    return{e,next:next?next.date:null,mensual:(e.amount||0)*(PERIOD_M[e.repeat]||1)};
  }).sort((a,b)=>(a.next||'9')<(b.next||'9')?-1:1);
}
function masRecibos(){
  const l=recibosList();const mes=l.reduce((s2,r)=>s2+r.mensual,0);

/* ----- coche: repostajes, consumo y gasolineras ----- */
function fuelStats(){
  const r=listOf('repostaje').filter(e=>e.km>0).sort((a,b)=>a.km-b.km);
  const segs=[];let lastFull=null,acc=0,accE=0;
  r.forEach(e=>{
    if(lastFull){acc+=e.litros||0;accE+=e.importe||0}
    if(e.lleno){if(lastFull&&e.km>lastFull.km){const km=e.km-lastFull.km;segs.push({to:e,km,l:acc,eur:accE,l100:acc/km*100,ekm:accE/km})}lastFull=e;acc=0;accE=0}
  });
  const tot=segs.reduce((a,s2)=>({km:a.km+s2.km,l:a.l+s2.l,eur:a.eur+s2.eur}),{km:0,l:0,eur:0});
  return{last:segs[segs.length-1]||null,avg:tot.km?tot.l/tot.km*100:null,ekm:tot.km?tot.eur/tot.km:null};
}

  const kms=rs.filter(e=>e.km>0&&e.date.slice(0,4)===y).map(e=>e.km);const kmY=kms.length>1?Math.max(...kms)-Math.min(...kms):null;

  if(kmY)h+=`<p class="note">Este año llevas unos ${fmtKm(kmY)} según el cuentakilómetros.</p>`;
  if(!st.last)h+=`<p class="note">Para calcular el consumo, apunta los km del cuentakilómetros cuando llenes el depósito. Con dos llenados ya sale.</p>`;
  h+=`<div class="btnrow"><button class="pri" data-act="add-repostaje">Apuntar repostaje</button></div>`;
  h+=`<section class="card"><h2>Gasolineras más baratas</h2><div id="gas-box"><p class="sub">Cargando…</p></div></section>`;
  if(rs.length)h+=`<section class="card"><h2>Repostajes</h2>${rs.slice(0,12).map(e=>`<button class="row2" data-rep="${e.id}"><span class="ic" style="--c:var(--accent)">${IC.repostaje}</span><span class="tx"><span class="t">${esc(e.gasolinera||'Repostaje')}</span><span class="m">${esc(shortDate(e.date))}${e.litros?', '+String(e.litros).replace('.',',')+' L':''}${e.litros&&e.importe?', '+(e.importe/e.litros).toLocaleString('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3})+' €/L':''}${e.lleno?', lleno':''}</span></span><span class="amt">${fmt(e.importe)}</span></button>`).join('')}</section>`;
  return h;

/* ----- tickets y precios ----- */
function priceIndex(){
  const st={};
  listOf('gasto').filter(e=>Array.isArray(e.items)&&e.items.length).forEach(e=>{
    const name=(e.store||e.title||'Tienda').trim();const k=norm(name);
    const s2=st[k]||(st[k]={name,tickets:0,total:0,last:'',products:{}});
    s2.tickets++;s2.total+=e.amount||0;if(e.date>s2.last)s2.last=e.date;
    e.items.forEach(it=>{if(!it||!it.p)return;const pk=norm(it.p);const unit=it.u!=null?it.u:(it.t!=null&&it.q?it.t/it.q:it.t);if(unit==null)return;(s2.products[pk]||(s2.products[pk]={name:it.p,hist:[]})).hist.push({u:unit,date:e.date})});
  });
  Object.values(st).forEach(s2=>Object.values(s2.products).forEach(p=>p.hist.sort((a,b)=>a.date<b.date?-1:1)));
  return st;
}

S.sumP='mes';S.sumWeek=null;S.sumYear=new Date().getFullYear();S.aiPer={};
function weekStart(s){const d=parse(s);return addDays(d,-((d.getDay()+6)%7))}
function periodData(from,to){
  const t=todayStr();let inR=0,outR=0,inP=0,outP=0;const cats={};
  const occ=occurrences(from,to);
  occ.forEach(({e,date})=>{if(e.kind!=='gasto'&&e.kind!=='ingreso')return;const a=e.amount||0,real=date<=t;if(e.kind==='gasto'){if(real)outR+=a;else outP+=a;const k=e.cat||'Otros';cats[k]=(cats[k]||0)+a}else{if(real)inR+=a;else inP+=a}});
  const all=[...S.entries.values()];
  const places=all.filter(e=>e.kind==='lugar'&&e.date>=from&&e.date<=to);
  const trips=allTrips().filter(tr=>tr.date<=to&&(tr.end||tr.date)>=from);
  const km=trips.filter(tr=>tr.transport==='coche'&&tr.km&&tr.date>=from&&tr.date<=to).reduce((s2,tr)=>s2+tr.km.total,0);
  return{inR,outR,inP,outP,cats,places,trips,km,
    eventos:occ.filter(o=>o.e.kind==='evento').length,
    tareas:all.filter(e=>e.kind==='tarea'&&e.done&&e.date>=from&&e.date<=to).length,
    ocio:all.filter(e=>e.kind==='ocio'&&e.estado==='visto'&&e.date&&e.date>=from&&e.date<=to),
    fuel:all.filter(e=>e.kind==='repostaje'&&e.date>=from&&e.date<=to)};
}
function catsHTML(cats){
  const rows=Object.entries(cats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);if(!rows.length)return'';
  const tot=rows.reduce((s2,x)=>s2+x[1],0),max=rows[0][1];
  return `<section class="card"><h2>En qué se fue el dinero</h2>${rows.map(([k,v])=>`<div class="cat"><span class="cn">${esc(k)}</span><span class="cv">${fmt(v)}<small>${Math.round(v/tot*100)} %</small></span><span class="track"><i class="fill" style="width:${(v/max*100).toFixed(1)}%"></i></span></div>`).join('')}</section>`;
}
function doneHTML(D,label){

  if(D.trips.length)rows.push(['viaje',`${D.trips.length} ${D.trips.length===1?'viaje':'viajes'}: ${D.trips.map(t2=>t2.title).join(', ')}${D.km?`, ${fmtKm(D.km)} en coche`:''}`]);
  const oc={peli:0,serie:0,libro:0};D.ocio.forEach(o=>{oc[o.otype]=(oc[o.otype]||0)+1});
  const ot=[oc.peli?`${oc.peli} ${oc.peli===1?'peli':'pelis'}`:'',oc.serie?`${oc.serie} ${oc.serie===1?'serie':'series'}`:'',oc.libro?`${oc.libro} ${oc.libro===1?'libro':'libros'}`:''].filter(Boolean);
  if(ot.length)rows.push(['ocio',ot.join(', ')]);

function appContext(){
  const t=todayStr(),r2=n=>Math.round(n*100)/100;
  const compact=e=>{
    const o={k:e.kind,t:e.title};if(e.date)o.d=e.date;if(e.end)o.fin=e.end;
    if(e.amount!=null)o.eur=e.amount;if(e.cat)o.cat=e.cat;if(e.repeat&&e.repeat!=='none')o.rep=e.repeat;
    if(e.currency&&e.currency!=='EUR'){o.moneda=e.currency;o.importe_original=e.amountOrig}
    if(e.city)o.ciudad=e.city;if(e.ptype)o.tipo=e.ptype;if(e.cuisine)o.comida=e.cuisine;if(e.rating)o.nota=e.rating;if(e.tip)o.pedir=e.tip;if(e.review)o.resena=String(e.review).slice(0,200);

    if(e.time)o.hora=e.time;if(e.place)o.lugar=e.place;if(e.kind==='tarea')o.hecha=!!e.done;
    if(e.kind==='viaje'){if(e.transport)o.transporte=e.transport;if(e.km&&e.km.total)o.km_ida_vuelta=e.km.total;if(e.moneda)o.moneda=e.moneda;if(e.budget)o.presupuesto=e.budget}
    if(e.kind==='persona'){o.rel=e.rel;if(e.cumple)o.cumple=e.cumple;if(e.anio)o.nacio=e.anio;if(e.gustos)o.gustos=e.gustos;if(e.nogusta)o.nogusta=e.nogusta;if(e.tallas)o.tallas=e.tallas}
    if(e.kind==='regalo'){o.para=personaName(e.para);o.estado=e.estado||'idea';if(e.precio)o.precio=e.precio;if(e.ocasion)o.ocasion=e.ocasion;if(e.anio)o.anio=e.anio}
    if(e.kind==='ocio'){o.tipo=e.otype;o.estado=e.estado;if(e.autor)o.autor=e.autor}
    if(e.kind==='caducidad'&&e.persona)o.de=personaName(e.persona);
    if(e.kind==='repostaje'){o.litros=e.litros;o.eur=e.importe;if(e.km)o.km_coche=e.km;o.t=e.gasolinera||'Repostaje'}
    if(e.kind==='cuenta'){o.tipo=ATYPES[e.atype];o.saldo=balAt(e,t)}
    if(e.kind==='pendiente'&&e.recomienda)o.recomienda=e.recomienda;
    if(e.store)o.tienda=e.store;if(Array.isArray(e.items))o.productos=e.items.slice(0,25).map(i=>i.p+': '+(i.u!=null?i.u:i.t));
    if(e.tripId&&e.tripId!=='none'){const tr=S.entries.get(e.tripId);if(tr)o.viaje=tr.title}
    return o;
  };
  const all=[...S.entries.values()].filter(e=>e.kind!=='cfg'&&e.kind!=='traspaso');
  const from=ymd(new Date(new Date().getFullYear()-2,0,1,12)),agg={};
  occurrences(from,t).forEach(({e,date})=>{if(e.kind!=='gasto'&&e.kind!=='ingreso')return;const m=date.slice(0,7);const a=agg[m]||(agg[m]={gastos:{},ingresos:0});if(e.kind==='gasto'){const k=e.cat||'Otros';a.gastos[k]=r2((a.gastos[k]||0)+(e.amount||0))}else a.ingresos=r2(a.ingresos+(e.amount||0))});
  let list=all.map(compact);
  const pack=()=>JSON.stringify({hoy:t,totales_por_mes:agg,apuntes:list});
  let json=pack();
  if(json.length>150000){const lim=ymd(addDays(parse(t),-540));list=list.filter(o=>!o.d||o.d>=lim);json=pack()}
  if(json.length>150000){list=list.slice(-1500);json=pack()}
  return json;
}

const LIBS={xlsx:'vendor/xlsx.mini.min.js',jspdf:'vendor/jspdf.umd.min.js'};
const libLoaded={};
function loadLib(name){
  if(libLoaded[name])return libLoaded[name];
  libLoaded[name]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[name];s.onload=()=>res();s.onerror=()=>{libLoaded[name]=null;rej(new Error('lib'))};document.head.appendChild(s)});
  return libLoaded[name];

async function saveOut(b,filename){

function yearData(y){
  const from=y+'-01-01',to=y+'-12-31',occ=occurrences(from,to);
  const gastos=[],ingresos=[],cats={},months=Array.from({length:12},()=>({i:0,g:0}));
  const def=defaultAcc();
  occ.forEach(({e,date})=>{
    if(e.kind!=='gasto'&&e.kind!=='ingreso')return;
    const mi=+date.slice(5,7)-1,acc=accountOf(e,def),accN=acc?(S.entries.get(acc)||{}).title||'':'',trip=e.tripId&&e.tripId!=='none'&&S.entries.get(e.tripId);
    const row={date,title:e.title,cat:e.cat||'Otros',amount:e.amount||0,cur:e.currency&&e.currency!=='EUR'?e.currency:'',orig:e.currency&&e.currency!=='EUR'?e.amountOrig:'',acc:accN,trip:trip?trip.title:''};
    if(e.kind==='gasto'){gastos.push(row);cats[row.cat]=(cats[row.cat]||0)+row.amount;months[mi].g+=row.amount}else{ingresos.push(row);months[mi].i+=row.amount}
  });
  gastos.sort((a,b)=>a.date<b.date?-1:1);ingresos.sort((a,b)=>a.date<b.date?-1:1);
  const tg=gastos.reduce((s2,r)=>s2+r.amount,0),ti=ingresos.reduce((s2,r)=>s2+r.amount,0);
  const trips=allTrips().filter(tr=>tr.date.slice(0,4)===String(y)).sort((a,b)=>a.date<b.date?-1:1).map(tr=>({t:tr.title,from:tr.date,to:tr.end||tr.date,days:daysBetween(tr.date,tr.end||tr.date)+1,transport:TRANSPORT[tr.transport]||'',km:tr.transport==='coche'&&tr.km?tr.km.total:'',spent:tripSpent(tr)}));
  const places=listOf('lugar').filter(p=>p.date.slice(0,4)===String(y)).sort((a,b)=>a.date<b.date?-1:1);
  const fuel=listOf('repostaje').filter(r=>r.date.slice(0,4)===String(y)).sort((a,b)=>a.date<b.date?-1:1);
  const ocio=listOf('ocio').filter(o=>o.estado==='visto'&&o.date&&o.date.slice(0,4)===String(y));
  return{y,gastos,ingresos,cats,months,tg,ti,trips,places,fuel,ocio,recibos:recibosList()};
}

function extras2Click(el,d){
  if(d.askex){const i=$('#ask-q');if(i)i.value=d.askex;askApp(d.askex);return true}
  if(d.pend){openPendSheet(d.pend);return true}

  if(d.evlike){evLike(d.evlike,+d.v);return true}
  if(S.sheet&&S.sheet.mode==='pendiente'){
    if(d.peptype){S.sheet.ptype=d.peptype;el.parentNode.querySelectorAll('[data-peptype]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));const cw=$('#pe-cuis');if(cw)cw.hidden=!FOODTYPES.includes(d.peptype);return true}

  }
  switch(d.act){
    case 'ask':{const i=$('#ask-q');if(i&&i.value.trim()){const q=i.value;i.value='';askApp(q)}return true}
    case 'add-pend':openPendSheet();return true;

}

  if(d.go){S.sel=d.go;S.cursor=monthOf(d.go);setView('cal');render();return}
  if(d.mtrip){S.mapTrip=d.mtrip;S.mapSel=null;renderMapUI();if(M.ready){focusCurrent(true);drawOverlay()}return}
  if(d.stop){const e=S.entries.get(d.stop);if(!e)return;if(hasGeo(e)){S.mapSel=e.id;renderMapCard();focusPts([[e.lon,e.lat]],true,true);$('#map-box').scrollIntoView({block:'nearest',behavior:reduceMotion()?'auto':'smooth'})}else openSheet({id:e.id});return}
  if(d.place)return startPlacing(d.place);
  if(d.geofind){const e=S.entries.get(d.geofind);if(e){persist(Object.assign({},e,{geoFail:false}),true);queueGeo(e.id);toast('Buscando «'+e.title+'»…')}return}
  if(d.key){S.placeKey=decodeURIComponent(d.key);setView('sitios');return}
  if(d.sitview){S.sit.view=d.sitview;renderSitios();return}
  if('sityear' in d){S.sit.year=d.sityear;renderSitiosResumen();return}
  if(d.sumcity){Object.assign(S.sit,{view:'lista',city:d.sumcity,type:'Todos',cuisine:'',q:''});renderSitios();window.scrollTo(0,0);return}
  if(d.sumtype){Object.assign(S.sit,{view:'lista',type:PTYPES.includes(d.sumtype)?d.sumtype:'Todos',city:'',cuisine:'',q:''});renderSitios();window.scrollTo(0,0);return}
  if(d.sumcuisine){Object.assign(S.sit,{view:'lista',cuisine:d.sumcuisine,type:'Todos',city:'',q:''});renderSitios();window.scrollTo(0,0);return}
  if('cuisinef' in d){S.sit.cuisine=d.cuisinef;el.parentNode.querySelectorAll('[data-cuisinef]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderSitiosList();return}
  if(d.wbg){SET.widgetBg=d.wbg;el.parentNode.querySelectorAll('[data-wbg]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));saveSettings();updateWidget();toast('Fondo del widget cambiado');return}
  if(d.act==='av-on'){(async()=>{const A=avisos();if(!A.on){const ok=await avisosPermiso();if(!ok){toast('Activa las notificaciones de Día a día en los ajustes del móvil.');return}}A.on=!A.on;SET.avisos=A;await saveSettings();el.setAttribute('aria-pressed',String(A.on));el.textContent=A.on?'Avisos activados':'Activar avisos';const o=$('#av-opts');if(o)o.hidden=!A.on;scheduleNotifs();toast(A.on?'Avisos activados':'Avisos desactivados')})();return}
  if('aveven' in d){SET.avisos=Object.assign(avisos(),{eventos:+d.aveven});saveSettings();el.parentNode.querySelectorAll('[data-aveven]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));scheduleNotifs();return}
  if(d.avk){const A=avisos();A[d.avk]=!A[d.avk];SET.avisos=A;saveSettings();el.setAttribute('aria-pressed',String(A[d.avk]));scheduleNotifs();return}
  if(d.typef){S.sit.type=d.typef;el.parentNode.querySelectorAll('[data-typef]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderSitiosList();return}
  if('cityf' in d){S.sit.city=d.cityf;el.parentNode.querySelectorAll('[data-cityf]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderSitiosList();return}
  if(d.sortby){S.sit.sort=d.sortby;el.parentNode.querySelectorAll('[data-sortby]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderSitiosList();return}
  if(d.ph!=null&&d.phset){openViewer(photoSet(d.phset),+d.ph);return}
  if(d.cat!=null&&S.comp){S.comp.cat=d.cat;S.comp.catTouched=true;el.parentNode.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));return}
  if(S.sheet){
    const sh=S.sheet;
    if(d.atype&&sh.mode==='cuenta'){sh.atype=d.atype;el.parentNode.querySelectorAll('[data-atype]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));updateAccFields();return}
    if(d.ptype){sh.ptype=sh.ptype===d.ptype?null:d.ptype;el.parentNode.querySelectorAll('[data-ptype]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ptype===sh.ptype)));const cw=$('#s-cuis');if(cw)cw.hidden=!FOODTYPES.includes(sh.ptype);return}
    if(d.cuisine){sh.cuisine=sh.cuisine===d.cuisine?null:d.cuisine;el.parentNode.querySelectorAll('[data-cuisine]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cuisine===sh.cuisine)));return}
    if(d.star){const n=+d.star;sh.rating=sh.rating===n?0:n;const box=$('#s-stars');if(box)box.innerHTML=starInputHTML(sh.rating);const v=$('#s-stv');if(v)v.textContent=sh.rating?fmtRating(sh.rating)+' de 5':'Sin nota';return}
    if(d.again){const v=d.again==='1';sh.again=sh.again===v?null:v;el.parentNode.querySelectorAll('[data-again]').forEach(b=>b.setAttribute('aria-pressed',String(sh.again!==null&&(b.dataset.again==='1')===sh.again)));return}
    if(d.rmph!=null){sh.photos.splice(+d.rmph,1);renderSheetPhotos();return}
  }
  switch(d.act){
    case 'prev':if(S.view==='sum'&&sumShift(-1))break;shiftMonth(-1);break;
    case 'next':if(S.view==='sum'&&sumShift(1))break;shiftMonth(1);break;
    case 'today':if(S.view==='sum'&&sumToday())break;goToday();break;
    case 'close':closeComp();break;
    case 'save':save();break;
    case 'del':askDelete();break;
    case 'del-all':doDelete('all');break;
    case 'del-from':doDelete('from');break;
    case 'del-cancel':$('#c-acts').innerHTML=actsHTML();break;
    case 'repeat':{const keys=Object.keys(REPEAT);const c=S.comp;c.repeat=keys[(keys.indexOf(c.repeat)+1)%keys.length];el.textContent=REPEAT[c.repeat];el.setAttribute('aria-pressed',String(c.repeat!=='none'));break}
    case 'trip':{const c=S.comp;c.trip=c.trip?null:d.trip;el.setAttribute('aria-pressed',String(!!c.trip));break}
    case 's-trip':{const sh=S.sheet;if(!sh)break;sh.tripTouched=true;sh.tripId=sh.tripId===d.trip?'none':d.trip;el.setAttribute('aria-pressed',String(sh.tripId===d.trip));break}
    case 'gps':gps();break;
    case 'sheet-cancel':closeSheet(false);break;
    case 'sheet-save':{const f=S.sheet&&SHEETS[S.sheet.mode];if(f)f();else sheetSave();break}
    case 'sheet-del':sheetDelete();break;
    case 'add-acc':openAccSheet({});break;
    case 'acc-edit':openAccSheet({id:d.id,focus:!!d.focus});break;
    case 'acc-back':S.accId=null;renderCuentas();window.scrollTo(0,0);break;
    case 'acc-del':deleteAccount(d.id);break;
    case 'a-primary':if(S.sheet){S.sheet.primary=!S.sheet.primary;el.setAttribute('aria-pressed',String(S.sheet.primary))}break;
    case 'transfer':goTransfer(d.from||null);break;
    case 'go-cuentas':closeComp();setView('cuentas');break;
    case 'add-place':addPlaceFor(d.trip);break;
    case 'edit-trip':{const tr=S.entries.get(d.id);if(!tr)break;S.sel=tr.date;S.cursor=monthOf(tr.date);setView('cal');render();openComp(null,tr.id,tr.date);break}
    case 'zoom-in':if(M.ready)M.svg.transition().duration(reduceMotion()?0:250).call(M.zoom.scaleBy,2);break;
    case 'zoom-out':if(M.ready)M.svg.transition().duration(reduceMotion()?0:250).call(M.zoom.scaleBy,0.5);break;
    case 'zoom-fit':if(M.ready)focusCurrent(true);break;
    case 'placing-cancel':S.placing=null;renderPlacing();break;
    case 'ai-sum':summarizeTrip(d.id);break;
    case 'backup':exportBackup();break;
    case 'settings':openSettings();break;
    case 'imp-ok':applyImport();break;
    case 'imp-cancel':{pendingImport=null;const b=$('#imp-confirm');if(b){b.hidden=true;b.innerHTML=''}break}
    case 'refresh-all':refreshWeather(true);refreshEvents();toast('Actualizando…');break;
    case 'g-test':{const k=$('#g-key').value.trim(),m=$('#g-model').value.trim();const old=[SET.geminiKey,SET.geminiModel];SET.geminiKey=k;SET.geminiModel=m||'gemini-flash-latest';const msg=$('#g-msg');msg.textContent='Probando…';gcall('Responde solo con la palabra: listo').then(()=>{msg.textContent='Funciona. Pulsa Guardar.'}).catch(e=>{msg.textContent=gemErr(e)}).finally(()=>{SET.geminiKey=old[0];SET.geminiModel=old[1]});break}
    case 'restore':if(typeof importPick==='function')importPick();break;
    case 'v-make':ensureAudio();makeVideo(d.id,{});break;
    case 'v-cancel':if(V.job)V.job.cancel=true;break;
    case 'v-save':saveVideo(d.id);break;
    case 'v-auto':{const tr=S.entries.get(d.id);if(!tr)break;const on=tr.videoAuto===false;persist(Object.assign({},tr,{videoAuto:on}));toast(on?'El vídeo se hará solo al añadir fotos':'El vídeo ya no se hará solo');break}
    case 'ai-stop':{const st=S.ai[d.id];if(st&&st.ctl)st.ctl.abort();break}
    case 'sitios-back':S.placeKey=null;renderSitios();window.scrollTo(0,0);break;
    case 'again-visit':{const g=groups().find(x=>x.key===S.placeKey);if(!g)break;const v=g.visits[0];openSheet({date:todayStr(),prefill:{title:v.title,city:v.city,ptype:v.ptype,cuisine:v.cuisine,lat:v.lat,lon:v.lon,geo:v.geo,geoPrec:v.geoPrec}});break}
    case 'see-map':{const e=S.entries.get(d.id);if(!e)break;S.mapTrip=e.tripId&&S.entries.get(e.tripId)?e.tripId:'all';S.mapSel=e.id;S.placeKey=null;M.focused=true;setView('map',{focus:hasGeo(e)?[[e.lon,e.lat]]:null});break}
    case 'v-close':closeViewer();break;
    case 'v-prev':{const v=S.viewer;if(v){v.i=(v.i-1+v.list.length)%v.list.length;showViewer()}break}
    case 'v-next':{const v=S.viewer;if(v){v.i=(v.i+1)%v.list.length;showViewer()}break}
  }
});
const comp=$('#comp');
comp.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){ev.preventDefault();save()}if(ev.key==='Escape')closeComp()});
comp.addEventListener('change',ev=>{if(ev.target.id==='c-cur')setCompCurrency(ev.target.value)});
comp.addEventListener('input',ev=>{if(ev.target.id==='c-rate'){ev.target.dataset.touched='1';updateConv()}if(ev.target.id==='c-amount')updateConv();
  const err=$('#c-err');if(err)err.textContent='';
  const c=S.comp;
  if(c&&ev.target.id==='c-text'&&(c.kind==='gasto'||c.kind==='ingreso')&&!c.catTouched){
    const g=guessCat(c.kind,ev.target.value);c.cat=g;
    comp.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===g)));
  }
});
const sheet=$('#sheet');
sheet.addEventListener('change',ev=>{
  if(ev.target.id==='s-file'){const files=[...ev.target.files];ev.target.value='';addPhotos(files)}
  if(ev.target.id==='s-date')renderSheetTrip();
});
sheet.addEventListener('input',()=>{const e=$('#s-err');if(e)e.textContent=''});
$('#mas-body').addEventListener('input',ev=>{if(ev.target.id==='pq'){S.pq=ev.target.value;renderPriceSearch()}});
$('#mas-body').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='ask-q'){ev.preventDefault();const q=ev.target.value;ev.target.value='';askApp(q);return}if(ev.key==='Enter'&&ev.target.id==='m-new'){ev.preventDefault();const b=document.querySelector('[data-act="m-add"]');if(b)b.click()}});
$('#sitios-body').addEventListener('input',ev=>{if(ev.target.id==='sq'){S.sit.q=ev.target.value;renderSitiosList()}});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape')return;
  if(S.viewer)closeViewer();else if(S.sheet)closeSheet(false);else if(S.placing){S.placing=null;renderPlacing()}
});
let tx=null,ty=null;
const grid=$('#grid');
grid.addEventListener('touchstart',e=>{const p=e.changedTouches[0];tx=p.clientX;ty=p.clientY},{passive:true});
grid.addEventListener('touchend',e=>{if(tx==null)return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty;tx=null;if(Math.abs(dx)>60&&Math.abs(dy)<45)shiftMonth(dx<0?1:-1)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

renderAdds();render();boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshWeather();if(!S.evAt||Date.now()-S.evAt>3*3600e3){S.evAt=Date.now();refreshEvents()}}});
})();
</script>
</body>
